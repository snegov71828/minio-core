[workspace]
authors = ["Ilya Snegov <unweariedheart@gmail.com>"]
name = "minio-core"
version = "0.3.0"
license = "MIT-0"
repository = "https://github.com/snegoviol/minio-core"

channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.82.0"

[tasks]

[dependencies]
python = ">=3.15.0,<3.16"
pydantic-settings = ">=2.16.0,<3"
